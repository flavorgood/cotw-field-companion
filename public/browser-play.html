<!doctype html>
<html lang="en" data-runtime="browser-journal">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><title>GrindZone</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="browser-play.css"><script type="module" src="browser-play.js"></script></head>
<body><header class="brand"><a href="./" aria-label="GrindZone home">GrindZone</a><span>Phone &amp; console journal</span></header>
<main id="play"><section class="panel"><h1>Opening your journal</h1><p role="status">Reading this browser’s saved progress…</p></section></main>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="edit-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" data-close aria-label="Close editor">Close</button></div><div id="edit-fields"></div><p id="edit-error" role="alert"></p><button type="button" id="review-change" hidden>Refresh journal and review</button><div class="dialog-actions"><button type="button" data-close>Cancel</button><button type="submit" id="edit-save" class="primary">Save</button></div></form></dialog>
<noscript><p>GrindZone needs JavaScript to keep your browser journal. No game-save access or PC pairing is required for this page.</p></noscript></body></html>
